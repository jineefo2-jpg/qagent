<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QuantAgent · 量化分析助手</title>
<script>
  // 加载 marked.js 之前先检测浏览器 —— QQ/UC/微信等老内核直接跳过加载
  (function() {
    try {
      var ua = (navigator.userAgent || '').toLowerCase();
      var isLegacy = /mqqbrowser|qqbrowser|ucbrowser|micromessenger|xiaomi|liebao|sogoumobile|baiduboxapp/.test(ua)
                  || location.search.indexOf('compat=1') >= 0;
      window.__LEGACY_BROWSER__ = isLegacy;
      if (!isLegacy) {
        // 只在现代浏览器加载 marked.js（避免它在老内核里崩）
        document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"><\/scr' + 'ipt>');
      }
    } catch (_) {
      window.__LEGACY_BROWSER__ = true;
    }
  })();
</script>
<style>
  :root {
    --bg:          #0d1117;
    --bg-elev:     #161b22;
    --bg-elev-2:   #1f2937;
    --border:      #30363d;
    --text:        #e6edf3;
    --text-muted:  #8b949e;
    --primary:     #00d4aa;
    --primary-dim: #00d4aa33;
    --danger:      #f85149;
    --warning:     #d29922;
    --user-bg:     #1f6feb;
    --code-bg:     #0a0d12;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: var(--bg); color: var(--text); overflow: hidden; }

  .app { display: flex; height: 100vh; }

  /* ── 侧边栏 ── */
  .sidebar {
    width: 260px;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-size: 18px;
    font-weight: 600;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .new-btn {
    margin: 12px 16px;
    padding: 10px 14px;
    background: var(--primary);
    color: #000;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .new-btn:hover { opacity: 0.85; }

  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 16px;
  }
  .session-item {
    padding: 10px 12px;
    margin-bottom: 4px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.15s;
  }
  .session-item:hover { background: var(--bg-elev-2); color: var(--text); }
  .session-item.active {
    background: var(--primary-dim);
    color: var(--text);
  }
  .session-title { flex: 1; overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; }
  .session-delete {
    visibility: hidden;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0 4px;
    font-size: 14px;
  }
  .session-item:hover .session-delete { visibility: visible; }
  .session-delete:hover { color: var(--danger); }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ── 主对话区 ── */
  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .chat-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat-title { font-size: 15px; font-weight: 600; }
  .chat-meta { font-size: 12px; color: var(--text-muted); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20%;
    scroll-behavior: smooth;
  }
  @media (max-width: 1200px) { .messages { padding: 24px 10%; } }
  @media (max-width: 800px)  { .messages { padding: 16px 12px; } }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 80px 0;
  }
  .empty-state h2 { color: var(--text); margin-bottom: 12px; font-weight: 500; }
  .empty-state .examples {
    margin-top: 32px;
    display: grid;
    gap: 10px;
  }
  .example-btn {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  .example-btn:hover {
    border-color: var(--primary);
    background: var(--bg-elev-2);
  }

  .msg { margin-bottom: 20px; }
  .msg-role {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-muted);
  }
  .msg-role .badge {
    display: inline-block;
    width: 24px;
    height: 24px;
    border-radius: 4px;
    text-align: center;
    line-height: 24px;
    font-size: 12px;
    color: #000;
  }
  .msg.user .badge { background: var(--user-bg); color: #fff; }
  .msg.assistant .badge { background: var(--primary); }

  .msg-content {
    padding: 14px 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 8px;
    line-height: 1.7;
    font-size: 14px;
    word-wrap: break-word;
  }
  .msg.user .msg-content { background: var(--bg-elev-2); }
  .msg-content p { margin: 8px 0; }
  .msg-content p:first-child { margin-top: 0; }
  .msg-content p:last-child { margin-bottom: 0; }
  .msg-content h1, .msg-content h2, .msg-content h3, .msg-content h4 {
    margin: 14px 0 8px;
    color: var(--primary);
  }
  .msg-content h1 { font-size: 18px; }
  .msg-content h2 { font-size: 16px; }
  .msg-content h3 { font-size: 14px; }
  .msg-content code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: "Menlo", "Monaco", monospace;
    font-size: 12px;
    color: #ffa657;
  }
  .msg-content pre {
    background: var(--code-bg);
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg-content pre code { background: none; padding: 0; }
  .msg-content table {
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13px;
    width: 100%;
  }
  .msg-content th, .msg-content td {
    padding: 8px 12px;
    border: 1px solid var(--border);
  }
  .msg-content th { background: var(--bg-elev-2); color: var(--primary); }
  .msg-content blockquote {
    border-left: 3px solid var(--warning);
    padding: 4px 12px;
    color: var(--text-muted);
    margin: 8px 0;
    background: rgba(210, 153, 34, 0.08);
  }
  .msg-content ul, .msg-content ol { padding-left: 24px; margin: 8px 0; }

  /* 流式渲染期间防止半成品 markdown 抖动 */
  .msg-content > *:first-child { margin-top: 0; }
  .msg-content > *:last-child { margin-bottom: 0; }
  .msg-content table { table-layout: fixed; }
  .msg-content pre { white-space: pre-wrap; word-break: break-word; }

  /* ── 工具执行卡片 ── */
  .tool-trace {
    margin-top: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-elev-2);
    font-size: 12px;
    overflow: hidden;
  }
  .tool-trace-header {
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  .tool-trace-header:hover { background: rgba(255,255,255,0.03); }
  .tool-icon {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    background: var(--primary);
    color: #000;
    text-align: center;
    line-height: 18px;
    font-size: 11px;
    font-weight: 700;
  }
  .tool-trace.error .tool-icon { background: var(--danger); color: #fff; }
  .tool-name {
    font-family: "Menlo", monospace;
    color: var(--primary);
    font-weight: 600;
  }
  .tool-trace.error .tool-name { color: var(--danger); }
  .tool-status { margin-left: auto; color: var(--text-muted); font-size: 11px; }
  .tool-arrow { color: var(--text-muted); transition: transform 0.2s; }
  .tool-trace.open .tool-arrow { transform: rotate(90deg); }

  .tool-trace-body {
    display: none;
    padding: 8px 12px 12px;
    border-top: 1px solid var(--border);
  }
  .tool-trace.open .tool-trace-body { display: block; }
  .tool-trace-body pre {
    background: var(--code-bg);
    padding: 8px;
    border-radius: 4px;
    overflow-x: auto;
    margin: 4px 0;
    font-size: 11px;
    line-height: 1.5;
  }
  .tool-trace-body .label {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 6px;
    margin-bottom: 2px;
  }

  /* ── 思考过程 ── */
  .thought {
    padding: 8px 12px;
    margin-top: 8px;
    background: rgba(0, 212, 170, 0.05);
    border-left: 2px solid var(--primary);
    border-radius: 4px;
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* ── 输入区 ── */
  .input-area {
    border-top: 1px solid var(--border);
    padding: 16px 20%;
    background: var(--bg-elev);
  }
  @media (max-width: 1200px) { .input-area { padding: 16px 10%; } }
  @media (max-width: 800px)  { .input-area { padding: 12px; } }

  .input-wrap {
    display: flex;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    align-items: center;   /* 附件按钮 + textarea + 发送按钮 垂直居中 */
  }
  .input-wrap:focus-within { border-color: var(--primary); }
  textarea {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-size: 14px;
    padding: 8px;
    resize: none;
    min-height: 24px;
    max-height: 200px;
    font-family: inherit;
    line-height: 1.5;
  }
  textarea:focus { outline: none; }
  .send-btn {
    padding: 8px 18px;
    background: var(--primary);
    color: #000;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.15s;
    height: 36px;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn.cancel-mode {
    background: var(--danger);
    color: #fff;
  }
  .send-btn.cancel-mode:hover { opacity: 0.85; }

  .upload-btn {
    width: 36px;
    height: 36px;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .upload-btn:hover {
    color: var(--primary);
    border-color: var(--primary);
    background: var(--primary-dim);
  }
  .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .upload-btn.uploading {
    color: var(--primary);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .attachment-area {
    margin-bottom: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .attachment-area:empty { margin: 0; }
  .attachment-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-elev-2);
    border: 1px solid var(--primary-dim);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    max-width: 280px;
  }
  .attachment-chip .att-icon { font-size: 16px; }
  .attachment-chip .att-name {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .attachment-chip .att-size {
    color: var(--text-muted);
    font-size: 11px;
    flex-shrink: 0;
  }
  .attachment-chip .att-remove {
    background: none; border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px; line-height: 1;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .attachment-chip .att-remove:hover { color: var(--danger); }

  /* 消息气泡内附件展示 */
  .msg-attachment {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    max-width: 400px;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--primary); }

  .input-hint {
    margin-top: 6px;
    padding-bottom: 10px;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
  }

  /* ── 图表加载失败占位 ── */
  .chart-failed-notice {
    margin-top: 12px;
    padding: 12px 16px;
    background: rgba(248, 81, 73, 0.04);
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
    line-height: 1.5;
  }
  .chart-failed-notice::before {
    content: '📊 ';
    opacity: 0.6;
  }

  /* ── Follow-up 建议 chip（answer 下方）── */
  .suggestions {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .suggestions-label {
    width: 100%;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .suggestion-chip {
    padding: 7px 12px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    line-height: 1.4;
    max-width: 100%;
    font-family: inherit;
  }
  .suggestion-chip:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(0, 212, 170, 0.08);
  }
  .suggestion-chip::before {
    content: '💡 ';
    opacity: 0.6;
    margin-right: 2px;
  }

  /* ── 流式进度指示器（常驻直到 final 事件）── */
  .msg-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    margin-top: 10px;
    background: rgba(0, 212, 170, 0.08);
    border: 1px solid var(--primary-dim);
    border-radius: 14px;
    font-size: 12px;
    color: var(--primary);
  }
  .msg-status .status-text {
    margin-left: 6px;
    font-weight: 500;
  }
  .msg-status.error-state {
    background: rgba(248, 81, 73, 0.08);
    border-color: var(--danger);
    color: var(--danger);
  }

  /* ── Loading 状态 ── */
  .loading-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--primary);
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .loading-dot:nth-child(1) { animation-delay: -0.32s; }
  .loading-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ═══════════════════════════════════════════════════════
     移动端响应式适配（≤ 768px）
     ═══════════════════════════════════════════════════════ */

  /* 默认隐藏汉堡按钮，仅移动端显示 */
  .mobile-menu-btn {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }
  .sidebar-mask {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 998;
  }

  @media (max-width: 768px) {
    body { overflow: auto; }
    html, body { height: auto; min-height: 100vh; }

    .app { height: 100vh; }

    /* 侧边栏改成抽屉（默认隐藏，加 .open 才显示） */
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 80vw;
      max-width: 320px;
      height: 100%;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 999;
      box-shadow: 2px 0 12px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-mask.show { display: block; }

    /* 主区域占满 */
    .chat-area { width: 100%; }

    /* 汉堡按钮显示 */
    .mobile-menu-btn { display: inline-block; }

    /* header 紧凑 */
    .chat-header {
      padding: 10px 12px;
      gap: 8px;
    }
    .chat-title { font-size: 14px; }
    .chat-meta { display: none; }  /* 移动端隐藏次要信息 */

    /* 消息区减小内边距 */
    .messages {
      padding: 16px 12px;
      padding-bottom: 160px;  /* 给底部输入区留位 */
    }

    /* 输入区固定底部 + 安全区 */
    .input-area {
      padding: 10px 12px env(safe-area-inset-bottom, 10px);
      position: sticky;
      bottom: 0;
    }
    .input-wrap {
      padding: 6px;
      gap: 6px;
    }
    textarea {
      font-size: 16px;  /* iOS 16+ 避免 input focus 自动放大 */
      padding: 6px;
      min-height: 28px;
    }
    .send-btn {
      padding: 8px 12px;
      font-size: 13px;
      min-width: 56px;
    }
    .upload-btn { width: 36px; height: 36px; }
    .input-hint { font-size: 10px; }

    /* 工具卡片紧凑 */
    .tool-trace-body pre { font-size: 10px; }

    /* 消息气泡内边距减小 */
    .msg-content { padding: 12px 14px; font-size: 14px; }
    .msg { margin-bottom: 16px; }

    /* 建议 chip 一行一个 */
    .suggestion-chip {
      width: 100%;
      text-align: left;
    }

    /* 图表/上传卡片 */
    .attachment-chip { max-width: 100%; }

    /* 空状态例子按钮 */
    .empty-state { padding: 40px 0; }
    .empty-state h2 { font-size: 18px; }
    .example-btn { font-size: 12px; padding: 10px 12px; }
  }

  /* 平板（768-1024px）：保留侧边栏但缩窄 */
  @media (min-width: 769px) and (max-width: 1024px) {
    .sidebar { width: 220px; }
    .messages { padding: 20px 8%; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- 移动端遮罩（点击关闭侧边栏）-->
  <div class="sidebar-mask" id="sidebarMask" onclick="toggleSidebar(false)"></div>

  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">📊 QuantAgent</div>
      <div class="logo-sub">v1.0 · 量化分析助手</div>
    </div>
    <button class="new-btn" onclick="createSession()">+ 新对话</button>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-footer">
      会话数据仅存于内存，重启服务即清空
    </div>
  </aside>

  <!-- 对话主区 -->
  <main class="chat-area">
    <header class="chat-header">
      <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="菜单">☰</button>
      <div class="chat-title" id="chatTitle" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">未选择会话</div>
      <div class="chat-meta" id="chatMeta"></div>
    </header>

    <div class="messages" id="messages">
      <div class="empty-state">
        <h2>📊 QuantAgent 量化分析助手</h2>
        <p>多因子打分 · 期权定价 · 风险评估 · 财经搜索</p>
      </div>
    </div>

    <div class="input-area">
      <div class="attachment-area" id="attachmentArea"></div>
      <div class="input-wrap">
        <button class="upload-btn" id="uploadBtn"
                onclick="document.getElementById('pdfInput').click()"
                title="附加 PDF（点击发送时随消息一起上传）">📎</button>
        <input type="file" id="pdfInput" accept=".pdf"
               style="display:none" onchange="queueAttachment(this.files[0])">
        <textarea id="input"
                  placeholder="向 QuantAgent 提问... (Enter 发送, Shift+Enter 换行)"
                  rows="1"
                  onkeydown="handleKey(event)"
                  oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="onSendBtnClick()">发送</button>
      </div>
      <div class="input-hint">
        ⚠️ 仅供研究参考，不构成投资建议
        <span style="margin: 0 8px; opacity: 0.5;">·</span>
        <a href="mailto:jineefo2@gmail.com"
           style="color: var(--text-muted); text-decoration: none;"
           title="Author">jineefo2@gmail.com</a>
      </div>
    </div>
  </main>
</div>

<script>
// ════════════════════════════════════════════════════════════
// 全局错误捕获（手机调试用：直接显示在屏幕上）
// ════════════════════════════════════════════════════════════
function _dbgShow(msg) {
  // 等 toast 函数定义后再用；先粗暴 alert 兜底
  if (typeof showToast === 'function') {
    showToast(msg, 'error', 8000);
  } else {
    setTimeout(function() {
      var box = document.createElement('div');
      box.style.cssText = 'position:fixed;bottom:20px;left:10px;right:10px;z-index:9999;background:#f85149;color:#fff;padding:10px;border-radius:6px;font-size:11px;word-break:break-all;';
      box.textContent = msg;
      document.body.appendChild(box);
      setTimeout(function() { box.remove(); }, 10000);
    }, 100);
  }
}
window.addEventListener('error', function(e) {
  console.warn('[GlobalError]', e.message, '@', e.filename, ':', e.lineno);
  _dbgShow('[JS Err] ' + (e.message || 'unknown') + ' @ ' + (e.lineno || '?'));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason || 'unknown');
  console.warn('[UnhandledRejection]', e.reason);
  _dbgShow('[Promise] ' + msg);
});

// ════════════════════════════════════════════════════════════
// 状态
// ════════════════════════════════════════════════════════════
let currentSession = null;
let isStreaming = false;
let currentAbortController = null;  // 当前请求的 AbortController

// 设备 ID：本浏览器 localStorage 唯一标识，让会话不跨设备共享
function getDeviceId() {
  let id = null;
  try {
    id = localStorage.getItem('quant_device_id');
  } catch (_) { /* localStorage 不可用（隐私模式）*/ }
  if (!id) {
    // crypto.randomUUID 在 iOS 15.4 以下不可用，做 fallback
    try {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        id = crypto.randomUUID();
      }
    } catch (_) {}
    if (!id) {
      id = 'dev-' + Math.random().toString(36).slice(2, 14)
                 + Date.now().toString(36);
    }
    try { localStorage.setItem('quant_device_id', id); } catch (_) {}
  }
  return id;
}
const DEVICE_ID = getDeviceId();

// 统一封装：所有 fetch 自动带上 X-Device-Id
async function api(url, options = {}) {
  options.headers = {
    ...(options.headers || {}),
    'X-Device-Id': DEVICE_ID,
  };
  return fetch(url, options);
}

// 复用 head 里已检测好的标志（如果未加载到 marked，也强制兼容模式）
var LEGACY_MODE = !!window.__LEGACY_BROWSER__ || !window.marked;
console.info('LEGACY_MODE =', LEGACY_MODE,
             '| has marked =', !!window.marked,
             '| UA:', navigator.userAgent);

// marked v4 配置（仅现代浏览器用）
if (window.marked && !LEGACY_MODE) {
  try {
    if (typeof marked.setOptions === 'function') {
      marked.setOptions({ breaks: true, gfm: true });
    } else if (typeof marked.use === 'function') {
      marked.use({ breaks: true, gfm: true });
    }
  } catch (e) {
    console.warn('marked 配置失败，自动切兼容模式:', e);
    LEGACY_MODE = true;
  }
}

// 兼容模式下的纯文本渲染（保留换行 + 自动识别 url）
function _plainTextRender(src) {
  var safe = escapeHtml(src);
  // 把 http(s):// 链接转成可点击
  safe = safe.replace(
    /(https?:\/\/[^\s<>"']+)/g,
    '<a href="$1" target="_blank" rel="noopener" style="color:var(--primary);">$1</a>'
  );
  return '<div style="white-space:pre-wrap;word-break:break-word;">' + safe + '</div>';
}

// 把 LLM 误生成的绝对 URL 改回相对路径
// 例：http://localhost:8001/static/charts/x.html → /static/charts/x.html
function _normalizeUrls(src) {
  try {
    return src.replace(
      /https?:\/\/[^\/\s)]+(\/static\/[^\s)\]"']+)/g,
      '$1'
    );
  } catch (_) { return src; }
}

// 安全的 markdown 渲染封装
function safeMarkdown(text) {
  var src = (text == null) ? '' : String(text);
  if (!src) return '';
  src = _normalizeUrls(src);

  // 老浏览器直接走纯文本（避免 marked 内部 substring 类崩溃）
  if (LEGACY_MODE) return _plainTextRender(src);

  if (!window.marked || typeof marked.parse !== 'function') {
    return _plainTextRender(src);
  }
  var html;
  try {
    html = marked.parse(src);
  } catch (e) {
    console.warn('marked.parse 失败，本次降级:', e);
    // 一旦失败，永久切到兼容模式，后续不再尝试
    LEGACY_MODE = true;
    return _plainTextRender(src);
  }
  if (typeof html !== 'string') return _plainTextRender(src);
  try {
    html = html.replace(/<a (?![^>]*\btarget=)/g,
                         '<a target="_blank" rel="noopener" ');
  } catch (_) {}
  return html;
}

// 流式期间节流渲染 markdown（避免每个 token 都重排）
function scheduleMarkdownRender(contentDom) {
  if (contentDom._renderScheduled) return;
  contentDom._renderScheduled = true;
  setTimeout(() => {
    contentDom._renderScheduled = false;
    if (!contentDom._streaming) return;
    contentDom.innerHTML = safeMarkdown(contentDom._raw);
  }, 80);
}

// ════════════════════════════════════════════════════════════
// 会话管理
// ════════════════════════════════════════════════════════════

async function loadSessions() {
  const r = await api('/api/sessions');
  const sessions = await r.json();
  renderSessionList(sessions);
  return sessions;
}

function renderSessionList(sessions) {
  const list = document.getElementById('sessionList');
  if (sessions.length === 0) {
    list.innerHTML = '<div style="padding:16px;color:var(--text-muted);font-size:12px;text-align:center;">暂无会话</div>';
    return;
  }
  list.innerHTML = sessions.map(s => `
    <div class="session-item ${s.id === currentSession ? 'active' : ''}"
         onclick="switchSession('${s.id}')">
      <span class="session-title">${escapeHtml(s.title)}</span>
      <button class="session-delete" onclick="event.stopPropagation();deleteSession('${s.id}')">×</button>
    </div>
  `).join('');
}

async function createSession() {
  const r = await api('/api/sessions', { method: 'POST' });
  const session = await r.json();
  currentSession = session.id;
  await loadSessions();
  await loadSessionDetail(session.id);
  if (window.innerWidth <= 768) toggleSidebar(false);
}

async function switchSession(sid) {
  if (isStreaming) return;
  currentSession = sid;
  await loadSessions();
  await loadSessionDetail(sid);
  // 手机端切换会话后自动收起侧边栏
  if (window.innerWidth <= 768) toggleSidebar(false);
}

// 移动端侧边栏抽屉控制
function toggleSidebar(force) {
  const sidebar = document.querySelector('.sidebar');
  const mask = document.getElementById('sidebarMask');
  const open = (typeof force === 'boolean') ? force : !sidebar.classList.contains('open');
  sidebar.classList.toggle('open', open);
  mask.classList.toggle('show', open);
}

async function deleteSession(sid) {
  if (!confirm('删除该会话？')) return;
  await api('/api/sessions/' + sid, { method: 'DELETE' });
  if (currentSession === sid) {
    currentSession = null;
    showEmptyState();
  }
  await loadSessions();
}

async function loadSessionDetail(sid) {
  const r = await api('/api/sessions/' + sid);
  const detail = await r.json();
  document.getElementById('chatTitle').textContent = detail.title;
  document.getElementById('chatMeta').textContent =
    `创建于 ${detail.created_at} · ${detail.display.length} 条消息`;

  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  detail.display.forEach(m => renderMessage(m));
  scrollToBottom();
}

function showEmptyState() {
  document.getElementById('chatTitle').textContent = '未选择会话';
  document.getElementById('chatMeta').textContent = '';
  document.getElementById('messages').innerHTML = `
    <div class="empty-state">
      <h2>选择会话或新建一个</h2>
    </div>`;
}

// ════════════════════════════════════════════════════════════
// 消息渲染
// ════════════════════════════════════════════════════════════

function renderMessage(m) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + m.role;

  const roleLabel = m.role === 'user'
    ? '<span class="badge">U</span> 你'
    : '<span class="badge">Q</span> QuantAgent';

  // 只展示真失败的工具调用；静默错误不显示红卡
  const SILENT_ERROR_TOOLS = new Set(['factor_score', 'html_chart_render',
                                       'historical_prices', 'market_news_search',
                                       'technical_indicator', 'earnings_calendar',
                                       'economic_calendar', 'stock_announcements']);
  let toolsHtml = '';
  if (m.tool_calls && m.tool_calls.length) {
    toolsHtml = m.tool_calls
      .filter(tc => tc.is_error && !SILENT_ERROR_TOOLS.has(tc.name))
      .map(tc => renderToolTrace(tc))
      .join('');
  }

  // 静默失败的占位提示（assistant 消息）
  let chartFailHtml = '';
  if (m.role === 'assistant' && Array.isArray(m.tool_calls)) {
    const NOTICES = {
      'html_chart_render': '此处图表未能加载，您可以让我重新生成或换种方式分析',
      'historical_prices': '历史 K 线数据未能获取，请稍后重试或换个代码',
      'market_news_search': '未能检索到相关新闻，可换个关键词或股票代码再试',
      'technical_indicator': '技术指标计算所需历史数据不足，已自动跳过此项',
      'earnings_calendar': '财报日历数据暂未取到，请稍后或换个市场/代码再试',
      'economic_calendar': '经济日历数据源暂时不可用，请稍后再试',
      'stock_announcements': '公告数据暂未取到，请稍后再试',
    };
    const shownTools = new Set();
    chartFailHtml = m.tool_calls
      .filter(tc => tc.is_error && NOTICES[tc.name] && !shownTools.has(tc.name))
      .map(tc => {
        shownTools.add(tc.name);
        return `<div class="chart-failed-notice">${NOTICES[tc.name]}</div>`;
      })
      .join('');
  }

  // assistant 消息优先用服务端预渲染的 content_html（QQ/微信浏览器零依赖展示）
  let content;
  if (m.role === 'assistant') {
    if (m.content_html && typeof m.content_html === 'string') {
      content = m.content_html;
    } else {
      content = safeMarkdown(m.content);
    }
  } else {
    content = escapeHtml(m.content);
  }

  // 用户消息可携带附件（来自上传）
  let attachmentHtml = '';
  if (m.attachment) {
    attachmentHtml = `
      <div class="msg-attachment">
        📄 ${escapeHtml(m.attachment.name)}
        <span style="color:var(--text-muted)"> · ${m.attachment.size_kb} KB · ${m.attachment.chunks} 段</span>
      </div>`;
  }

  // 历史回放：assistant 消息携带的 follow-up 建议
  let suggestionsHtml = '';
  if (m.role === 'assistant' && Array.isArray(m.suggestions) && m.suggestions.length) {
    suggestionsHtml = '<div class="suggestions">' +
      '<span class="suggestions-label">💬 继续提问</span>' +
      m.suggestions.map(q =>
        `<button class="suggestion-chip" onclick="useSuggestion(this)">${escapeHtml(q)}</button>`
      ).join('') +
      '</div>';
  }

  div.innerHTML = `
    <div class="msg-role">${roleLabel}</div>
    ${attachmentHtml}
    <div class="msg-content">${content}</div>
    ${chartFailHtml}
    ${toolsHtml}
    ${suggestionsHtml}
  `;
  msgs.appendChild(div);
  return div;
}

function renderToolTrace(tc) {
  const isErr = tc.is_error;
  const status = tc.result
    ? (isErr ? '失败' : '成功')
    : '执行中...';
  const inputJson = JSON.stringify(tc.input, null, 2);
  const resultJson = tc.result
    ? JSON.stringify(tc.result, null, 2)
    : '';

  return `
    <div class="tool-trace ${isErr ? 'error' : ''}" data-tool-id="${tc.id || ''}">
      <div class="tool-trace-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="tool-arrow">▶</span>
        <span class="tool-icon">⚡</span>
        <span class="tool-name">${tc.name}</span>
        <span class="tool-status">${status}</span>
      </div>
      <div class="tool-trace-body">
        <div class="label">Input：</div>
        <pre>${escapeHtml(inputJson)}</pre>
        ${resultJson ? `
          <div class="label">Result：</div>
          <pre>${escapeHtml(resultJson)}</pre>
        ` : ''}
      </div>
    </div>
  `;
}

// ════════════════════════════════════════════════════════════
// 发送消息（SSE 流式）
// ════════════════════════════════════════════════════════════

function onSendBtnClick() {
  // 执行中点击 = 取消；空闲点击 = 发送
  if (isStreaming) {
    cancelCurrentRequest();
  } else {
    // 兜底：sendMessage 是 async，确保 reject 也能被捕获并展示
    Promise.resolve(sendMessage()).catch(function(e) {
      var msg = (e && e.message) ? e.message : String(e);
      _dbgShow('[Send Err] ' + msg);
      isStreaming = false;
      try { setSendBtnMode('send'); } catch(_) {}
    });
  }
}

function cancelCurrentRequest() {
  if (currentAbortController) {
    currentAbortController.abort();
    showToast('已取消请求', 'info', 1500);
  }
}

function setSendBtnMode(mode) {
  // mode: 'send' | 'cancel'
  const btn = document.getElementById('sendBtn');
  if (mode === 'cancel') {
    btn.textContent = '取消';
    btn.classList.add('cancel-mode');
    btn.disabled = false;
  } else {
    btn.textContent = '发送';
    btn.classList.remove('cancel-mode');
    btn.disabled = false;
  }
}

async function sendMessage() {
  if (isStreaming) return;
  const ta = document.getElementById('input');
  const text = ta.value.trim();
  const hasFile = !!pendingAttachment;
  if (!text && !hasFile) return;

  // ⭐ 第一时间给视觉反馈：清空输入 + 渲染用户气泡 + 状态条
  //   所有「await 网络请求」都放到后面，避免点完发送看似卡住
  isStreaming = true;
  setSendBtnMode('cancel');
  currentAbortController = new AbortController();

  // 暂存附件文件（后面才真正上传）
  const filePending = pendingAttachment;
  const filePreviewMeta = filePending ? {
    name: filePending.name,
    size_kb: +(filePending.size / 1024).toFixed(1),
    chunks: 0,   // 上传完成后再更新
  } : null;

  // 立即清空输入框
  ta.value = '';
  autoResize(ta);
  if (filePending) clearAttachment();

  // 立即渲染用户消息气泡
  renderMessage({
    role: 'user',
    content: text || '请阅读这份文档并给出分析',
    attachment: filePreviewMeta,
  });
  scrollToBottom();

  // 立即渲染 assistant 占位 + 状态条
  const assistantDom = renderMessage({
    role: 'assistant',
    content: '',
    tool_calls: [],
  });
  const contentDom = assistantDom.querySelector('.msg-content');
  contentDom.innerHTML = '';
  const statusDom = document.createElement('div');
  statusDom.className = 'msg-status';
  statusDom.innerHTML = `
    <span class="loading-dot"></span>
    <span class="loading-dot"></span>
    <span class="loading-dot"></span>
    <span class="status-text">思考中…</span>`;
  assistantDom.appendChild(statusDom);

  const tracesByName = {};

  // ↓ 这里之后才开始真正的异步工作
  let attachmentMeta = null;
  let serverMessage = text;

  try {
    // 1. 如果还没有会话，轻量创建（不刷 DOM，不调 loadSessionDetail —— 否则会清掉刚渲染的气泡）
    if (!currentSession) {
      setStatus(assistantDom, '正在创建会话…');
      const _r = await api('/api/sessions', { method: 'POST' });
      const _s = await _r.json();
      currentSession = _s.id;
      // 立即把标题同步到 header（与服务端逻辑一致：用户消息前 30 字）
      const _t = (text || '附件分析');
      const _title = _t.slice(0, 30) + (_t.length > 30 ? '...' : '');
      try {
        document.getElementById('chatTitle').textContent = _title;
        document.getElementById('chatMeta').textContent = '刚创建';
      } catch (_) {}
      // 立即刷一次侧边栏（让用户看到新会话出现在菜单里）
      loadSessions().catch(function(){});
    }

    // 2. 如果有附件，上传 + 入库
    if (filePending) {
      setStatus(assistantDom, `📎 上传 ${filePending.name}…`);
      // 临时把 pendingAttachment 设回来供 uploadAttachmentIfAny 用
      pendingAttachment = filePending;
      const upRes = await uploadAttachmentIfAny();
      pendingAttachment = null;
      if (!upRes) {
        contentDom.innerHTML = '<p style="color:var(--danger)">附件上传失败，请重试</p>';
        var _sd0 = assistantDom.querySelector('.msg-status');
        if (_sd0) _sd0.remove();
        return;
      }
      attachmentMeta = { name: upRes.filename, size_kb: upRes.size_kb,
                         chunks: upRes.chunks_added };
      // 实时更新已渲染的用户气泡里的附件 chip
      try {
        var allMsgs = document.querySelectorAll('.msg.user');
        var lastUser = allMsgs[allMsgs.length - 1];
        var att = lastUser && lastUser.querySelector('.msg-attachment');
        if (att) {
          att.innerHTML = '📄 ' + escapeHtml(attachmentMeta.name)
            + ' <span style="color:var(--text-muted)"> · '
            + attachmentMeta.size_kb + ' KB · ' + attachmentMeta.chunks + ' 段</span>';
        }
      } catch (_) {}
      serverMessage = `[附件 PDF：${upRes.filename}，已索引 ${upRes.chunks_added} 段] ${text || '请阅读这份文档并给出分析'}`;
    }

    setStatus(assistantDom, '🤔 思考中…');

    // 3. SSE 请求
    const resp = await api(`/api/sessions/${currentSession}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: serverMessage,
        attachment: attachmentMeta,
      }),
      signal: currentAbortController.signal,
    });

    if (!resp.ok) {
      contentDom.innerHTML = `<p style="color:var(--danger)">请求失败：${resp.status}</p>`;
      return;
    }

    // 兼容性检测：老浏览器（QQ X5 等）可能没有 ReadableStream
    if (!resp.body || typeof resp.body.getReader !== 'function') {
      // 降级：用 resp.text() 一次性读完，按 SSE 格式手动解析
      const txt = await resp.text();
      const chunks = (txt || '').split('\n\n');
      let fallbackFinal = null;
      for (const chunk of chunks) {
        if (!chunk || chunk.indexOf('data: ') !== 0) continue;
        try {
          const event = JSON.parse(chunk.slice(6));
          try { handleEvent(event, assistantDom, contentDom, tracesByName); }
          catch (he) { console.warn('handleEvent failed:', he); }
          if (event && event.type === 'final') fallbackFinal = event;
        } catch (_) { /* 单条解析失败跳过 */ }
      }
      // 兜底渲染
      if (fallbackFinal &&
          (!contentDom.innerHTML || !contentDom.innerHTML.trim())) {
        if (fallbackFinal.text_html) {
          contentDom.innerHTML = fallbackFinal.text_html;
        } else if (fallbackFinal.text) {
          contentDom.innerHTML = safeMarkdown(fallbackFinal.text);
        }
      }
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finalEvent = null;   // 保留 final 事件，DOM 空时兜底渲染

    while (true) {
      let chunkResult;
      try {
        chunkResult = await reader.read();
      } catch (re) {
        console.warn('reader.read failed:', re);
        break;
      }
      const done = chunkResult && chunkResult.done;
      const value = chunkResult && chunkResult.value;
      if (done) break;
      if (!value) continue;

      try {
        buffer += decoder.decode(value, { stream: true });
      } catch (de) { console.warn('decode failed:', de); continue; }

      const chunks = buffer.split('\n\n');
      buffer = chunks.pop() || '';

      for (let i = 0; i < chunks.length; i++) {
        const chunk = chunks[i];
        if (!chunk || chunk.indexOf('data: ') !== 0) continue;
        let event;
        try {
          event = JSON.parse(chunk.slice(6));
        } catch (pe) {
          console.warn('JSON.parse failed for chunk:', chunk.slice(0, 50));
          continue;
        }
        try {
          handleEvent(event, assistantDom, contentDom, tracesByName);
        } catch (he) {
          console.warn('handleEvent failed:', he, 'event:', event);
        }
        if (event && event.type === 'final') finalEvent = event;
      }
    }

    // 兜底：handleEvent('final') 没成功渲染时（DOM 空），手动补一下
    if (finalEvent && (!contentDom.innerHTML || !contentDom.innerHTML.trim())) {
      if (finalEvent.text_html && typeof finalEvent.text_html === 'string') {
        contentDom.innerHTML = finalEvent.text_html;
      } else if (finalEvent.text) {
        contentDom.innerHTML = safeMarkdown(finalEvent.text);
      }
    }

  } catch (e) {
    if (e && e.name === 'AbortError') {
      contentDom.innerHTML += `<p style="color:var(--warning);margin-top:8px;">⏸ 已取消（仍可继续追问）</p>`;
    } else {
      var emsg = (e && e.message) ? e.message : String(e);
      contentDom.innerHTML = `<p style="color:var(--danger)">网络错误：${escapeHtml(emsg)}</p>`;
      console.warn('sendMessage error:', e);
    }
  } finally {
    isStreaming = false;
    currentAbortController = null;
    setSendBtnMode('send');
    // 兜底清理：无论怎么结束都移除状态指示器
    var _sd = assistantDom.querySelector('.msg-status');
    if (_sd) _sd.remove();
    await loadSessions();
  }
}

// 友好的工具名映射（给用户看的中文）
const TOOL_LABELS = {
  market_quote:         '实时行情',
  factor_score:         '因子打分',
  technical_indicator:  '技术指标',
  black_scholes:        '期权定价',
  implied_volatility:   '隐含波动率',
  risk_metrics:         '风险指标',
  correlation_matrix:   '相关性矩阵',
  portfolio_optimizer:  '组合优化',
  market_news_search:   '搜索财经新闻',
  trading_calendar:     '交易日历',
  search_research_docs: '检索研报',
  historical_prices:    '历史 K 线',
  html_chart_render:    '生成图表',
};

function setStatus(assistantDom, text, isError = false) {
  const statusDom = assistantDom.querySelector('.msg-status');
  if (!statusDom) return;
  const tx = statusDom.querySelector('.status-text');
  if (tx) tx.textContent = text;
  if (isError) statusDom.classList.add('error-state');
}

function handleEvent(event, assistantDom, contentDom, tracesByName) {
  if (event.type === 'content_delta') {
    // 流式 token：累加 + 节流 markdown 渲染（避免每个 token 重排）
    if (!contentDom._streaming) {
      contentDom._streaming = true;
      contentDom.innerHTML = '';
      contentDom._raw = '';
    }
    contentDom._raw += event.text;
    scheduleMarkdownRender(contentDom);
    setStatus(assistantDom, '✍️ 正在生成回复…');
  }
  else if (event.type === 'thought') {
    setStatus(assistantDom, '🤔 思考中…');
  }
  else if (event.type === 'tool_call') {
    const label = TOOL_LABELS[event.name] || event.name;
    setStatus(assistantDom, `🔧 调用「${label}」…`);
    // 只在 JS 中记录待处理的调用，不在 UI 上显示卡片
    tracesByName[event.id] = {
      name: event.name,
      input: event.input,
    };
  }
  else if (event.type === 'tool_result') {
    const label = TOOL_LABELS[event.name] || event.name;
    // 这些"错误"是引导/部分失败，不该当失败展示红卡
    const SILENT_ERRORS = new Set(['factor_score', 'html_chart_render',
                                     'historical_prices', 'market_news_search',
                                     'technical_indicator', 'earnings_calendar',
                                     'economic_calendar', 'stock_announcements']);
    if (event.is_error && !SILENT_ERRORS.has(event.name)) {
      // 真失败 → 显示错误卡片，状态变红
      var pending = {};
      try {
        var _vals = Object.keys(tracesByName).map(function(k){ return tracesByName[k]; });
        for (var i = 0; i < _vals.length; i++) {
          if (_vals[i] && _vals[i].name === event.name) { pending = _vals[i]; break; }
        }
      } catch (_) {}
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderToolTrace({
        name: event.name,
        input: pending.input || {},
        result: event.result,
        is_error: true,
      });
      assistantDom.appendChild(wrapper.firstElementChild);
      setStatus(assistantDom, `⚠️「${label}」失败，继续…`, true);
    } else if (event.is_error) {
      // 静默错误
      setStatus(assistantDom, `✅「${label}」完成，处理中…`);
      // 静默失败 → 在消息里加占位提示（每次一个，去重）
      const NOTICES = {
        'html_chart_render': '此处图表未能加载，您可以让我重新生成或换种方式分析',
        'historical_prices': '历史 K 线数据未能获取，请稍后重试或换个代码',
        'market_news_search': '未能检索到相关新闻，可换个关键词或股票代码再试',
        'technical_indicator': '技术指标计算所需历史数据不足，已自动跳过此项',
        'earnings_calendar': '财报日历数据暂未取到，请稍后或换个市场/代码再试',
        'economic_calendar': '经济日历数据源暂时不可用，请稍后再试',
        'stock_announcements': '公告数据暂未取到，请稍后再试',
      };
      const noticeText = NOTICES[event.name];
      if (noticeText && !assistantDom.querySelector(`.silent-notice[data-tool="${event.name}"]`)) {
        const notice = document.createElement('div');
        notice.className = 'silent-notice chart-failed-notice';
        notice.dataset.tool = event.name;
        notice.textContent = noticeText;
        assistantDom.appendChild(notice);
      }
    } else {
      setStatus(assistantDom, `✅「${label}」完成，处理中…`);
    }
    // 从待处理列表移除
    for (const [id, p] of Object.entries(tracesByName)) {
      if (p.name === event.name) { delete tracesByName[id]; break; }
    }
  }
  else if (event.type === 'final') {
    // 流结束 → 关掉流式标记，最终一次性渲染
    contentDom._streaming = false;
    contentDom._raw = '';
    contentDom._renderScheduled = false;
    // 优先用服务端预渲染的 HTML（兼容性最佳），否则前端再渲一遍
    if (event.text_html && typeof event.text_html === 'string') {
      contentDom.innerHTML = event.text_html;
    } else {
      contentDom.innerHTML = safeMarkdown(event.text);
    }
    assistantDom.querySelectorAll('.thought').forEach(t => t.remove());
    const statusDom = assistantDom.querySelector('.msg-status');
    if (statusDom) statusDom.remove();
  }
  else if (event.type === 'suggestions') {
    // 在 assistant 消息底部追加 3 个建议 chip
    if (Array.isArray(event.items) && event.items.length) {
      const sg = document.createElement('div');
      sg.className = 'suggestions';
      sg.innerHTML = '<span class="suggestions-label">💬 继续提问</span>' +
        event.items.map(q =>
          `<button class="suggestion-chip" onclick="useSuggestion(this)">${escapeHtml(q)}</button>`
        ).join('');
      assistantDom.appendChild(sg);
    }
  }
  else if (event.type === 'error') {
    contentDom.innerHTML = `<p style="color:var(--danger)">❌ ${event.error}</p>`;
    const statusDom = assistantDom.querySelector('.msg-status');
    if (statusDom) statusDom.remove();
  }
}

// 点击建议 chip → 填入输入框并发送
function useSuggestion(btn) {
  if (isStreaming) return;
  const text = btn.textContent.trim();
  const ta = document.getElementById('input');
  ta.value = text;
  autoResize(ta);
  // 移除当前消息的建议块，避免回头再点
  var _sg = btn.closest('.suggestions');
  if (_sg) _sg.remove();
  sendMessage();
}

// ════════════════════════════════════════════════════════════
// 工具函数
// ════════════════════════════════════════════════════════════

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
}

function useExample(btn) {
  document.getElementById('input').value = btn.textContent.trim();
  autoResize(document.getElementById('input'));
  document.getElementById('input').focus();
}

// ════════════════════════════════════════════════════════════
// PDF 附件：选择 → 入队 → 发送时一起上传
// ════════════════════════════════════════════════════════════

let pendingAttachment = null;  // 当前待发送的附件（单文件）

function queueAttachment(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.pdf')) {
    showToast('只支持 PDF 文件', 'error');
    return;
  }
  if (file.size > 20 * 1024 * 1024) {
    showToast('文件超过 20MB 限制', 'error');
    return;
  }
  pendingAttachment = file;
  renderAttachmentChip(file);
  document.getElementById('pdfInput').value = '';  // 允许重选同名
  document.getElementById('input').focus();
}

function renderAttachmentChip(file) {
  const wrap = document.getElementById('attachmentArea');
  if (!file) {
    wrap.innerHTML = '';
    return;
  }
  const sizeKB = (file.size / 1024).toFixed(1);
  wrap.innerHTML = `
    <div class="attachment-chip">
      <span class="att-icon">📄</span>
      <span class="att-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span>
      <span class="att-size">${sizeKB} KB</span>
      <button class="att-remove" onclick="clearAttachment()" title="移除">×</button>
    </div>
  `;
}

function clearAttachment() {
  pendingAttachment = null;
  renderAttachmentChip(null);
}

async function uploadAttachmentIfAny() {
  /** 若有待发附件，上传到后端并入库，返回 result 或 null */
  if (!pendingAttachment) return null;
  const file = pendingAttachment;

  const uploadBtn = document.getElementById('uploadBtn');
  uploadBtn.classList.add('uploading');
  uploadBtn.disabled = true;

  const formData = new FormData();
  formData.append('file', file);
  try {
    const r = await api('/api/upload_pdf', { method: 'POST', body: formData });
    const result = await r.json();
    if (!result.success) {
      showToast(`❌ ${file.name}: ${result.error || '上传失败'}`, 'error');
      return null;
    }
    return result;
  } catch (e) {
    showToast(`❌ 上传网络错误: ${e.message}`, 'error');
    return null;
  } finally {
    uploadBtn.classList.remove('uploading');
    uploadBtn.disabled = false;
  }
}

let _toastTimer = null;
function showToast(msg, type = 'info', duration = 3000) {
  let toast = document.querySelector('.toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  clearTimeout(_toastTimer);
  toast.className = 'toast show ' + type;
  toast.textContent = msg;
  if (duration > 0) {
    _toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
  }
}

// ════════════════════════════════════════════════════════════
// 启动
// ════════════════════════════════════════════════════════════

loadSessions();
</script>
