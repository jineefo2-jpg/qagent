# 单人部署（2026-08-28）。三个服务：app（Web+Agent）、cron（每日数据/信号）、redis。
#
# ★ 反向代理与 TLS 不在这里：国内云的 80/443 对外提供服务需要域名备案。两种走法 ——
#   ① 已备案域名：在宿主机另起 Nginx/Caddy 指向 127.0.0.1:5000，并设 OAUTH_COOKIE_SECURE=1；
#   ② 不想备案（推荐给单人用）：端口只绑 127.0.0.1（下方就是），从本机
#      `ssh -L 8080:127.0.0.1:5000 user@云主机` 打隧道访问 —— 公网上根本没有开放端口，
#      访问密钥也就没有在明文 HTTP 上裸奔的机会。
services:
  app:
    build: .
    restart: unless-stopped
    env_file: [.env]
    # ★ 只绑回环：云主机的公网口不开放。要对外必须先过反代 + TLS（见文件头）。
    ports: ["127.0.0.1:5000:5000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      WARMUP: "1"
    volumes: [./data:/app/data, ./out:/app/out, ./logs:/app/logs, ./rag_db:/app/rag_db]
    depends_on: [redis]

  cron:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes: [./data:/app/data, ./out:/app/out, ./logs:/app/logs]
    # 工作日 21:30 跑数据更新 + 信号链（时区在镜像里已钉 Asia/Shanghai）。
    # 与 app 共用同一份 data volume：DuckDB 的写在 staging，promote 是原子替换，
    # app 的只读连接会自己发现 inode 变化并重连（query._conn 每次 stat）。
    command: >
      sh -c "echo '30 21 * * 1-5 cd /app && sh scripts/ashare_daily_update.sh' > /etc/cron.d/ashare
      && echo '' >> /etc/cron.d/ashare && chmod 0644 /etc/cron.d/ashare
      && crontab /etc/cron.d/ashare && cron -f"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]

volumes:
  redis-data:
